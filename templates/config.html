<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Gym Display - Configuration des Capteurs</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0b0f19; color: #ffffff;
            font-family: 'Segoe UI', Roboto, sans-serif;
            padding: 2rem; display: flex; justify-content: center;
        }
        .container {
            width: 100%; max-width: 800px;
            background: #111827; padding: 2rem; border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        h1 { color: #38bdf8; margin-bottom: 1.5rem; text-align: center; }
        .form-group {
            display: flex; gap: 1rem; margin-bottom: 2rem; flex-wrap: wrap;
        }
        input {
            flex: 1; min-width: 200px; padding: 0.8rem 1rem;
            background: #1f2937; border: 1px solid #374151; color: white;
            border-radius: 6px; font-size: 1rem; outline: none;
        }
        input:focus { border-color: #38bdf8; }
        button {
            padding: 0.8rem 1.5rem; background: #0284c7; color: white;
            border: none; border-radius: 6px; font-weight: bold; cursor: pointer;
            transition: background 0.2s; font-size: 1rem;
        }
        button:hover { background: #0369a1; }
        table {
            width: 100%; border-collapse: collapse; margin-top: 1rem;
        }
        th, td {
            padding: 1rem; text-align: left;
            border-bottom: 1px solid #1f2937;
        }
        th { color: #9ca3af; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 1px; }
        .btn-delete {
            background: #ef4444; padding: 0.4rem 0.8rem; font-size: 0.85rem;
        }
        .btn-delete:hover { background: #dc2626; }
        .nav-links {
            margin-top: 2rem; text-align: center; display: flex; justify-content: center; gap: 1.5rem;
        }
        .nav-links a { color: #38bdf8; text-decoration: none; font-weight: 600; }
        .nav-links a:hover { text-decoration: underline; }
        .mac-code { font-family: monospace; color: #a7f3d0; background: #064e3b; padding: 0.2rem 0.5rem; border-radius: 4px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Configuration des Capteurs BLE</h1>

        <!-- Formulaire d'ajout -->
        <div class="form-group">
            <input type="text" id="sensor-name" placeholder="Nom du capteur (ex: Ceinture Élie, Capteur 1)" required>
            <input type="text" id="sensor-mac" placeholder="Adresse MAC (ex: DC:0D:30:12:34:56)" required>
            <button onclick="addSensor()">Ajouter</button>
        </div>

        <!-- Liste des capteurs enregistrés -->
        <table>
            <thead>
                <tr>
                    <th>Nom du Capteur</th>
                    <th>Adresse MAC</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="sensors-list">
                <!-- Rempli en JS -->
            </tbody>
        </table>

        <div class="nav-links">
            <a href="/coach">← Retour au Panneau Coach</a>
            <a href="/">Aller à l'Écran Principal →</a>
        </div>
    </div>

    <script>
        const socket = io();

        // Demander la liste au chargement
        socket.on('connect', () => {
            socket.emit('get_sensors');
        });

        // Réception de la liste à jour
        socket.on('update_sensors_list', (sensors) => {
            const tbody = document.getElementById('sensors-list');
            tbody.innerHTML = '';

            if (sensors.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:#6b7280;">Aucun capteur enregistré pour le moment.</td></tr>`;
                return;
            }

            sensors.forEach(sensor => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${sensor.name}</strong></td>
                    <td><span class="mac-code">${sensor.mac}</span></td>
                    <td><button class="btn-delete" onclick="deleteSensor('${sensor.mac}')">Supprimer</button></td>
                `;
                tbody.appendChild(tr);
            });
        });

        function addSensor() {
            const nameInput = document.getElementById('sensor-name');
            const macInput = document.getElementById('sensor-mac');

            const name = nameInput.value.trim();
            const mac = macInput.value.trim();

            if (!name || !mac) {
                alert("Veuillez remplir le nom et l'adresse MAC.");
                return;
            }

            socket.emit('add_sensor', { name: name, mac: mac });

            nameInput.value = '';
            macInput.value = '';
        }

        function deleteSensor(mac) {
            if (confirm("Voulez-vous vraiment supprimer ce capteur ?")) {
                socket.emit('delete_sensor', { mac: mac });
            }
        }
    </script>
</body>
</html>
